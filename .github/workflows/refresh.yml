name: Daily refresh

# WDFW updates the Puget Sound table most weekdays, the ocean and Willapa reports
# weekly, and the Columbia report on Mondays. Checking daily means a new report is
# picked up within a day of appearing. The build is deterministic, so a day with no
# new report produces identical bytes and commits nothing.
on:
  schedule:
    - cron: '0 15 * * *'      # every day, 15:00 UTC (08:00 Pacific)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Actions are pinned to commit SHAs: a tag like @v4 is mutable and can be
      # repointed at new code by whoever controls that repository.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          persist-credentials: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      # A warm cache is the difference between one run of a few minutes and one that
      # re-reads four hundred PDFs and fourteen years of paginated HTML.
      - name: Restore the source cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: .cache
          key: wdfw-creel-${{ hashFiles('data/manifest.json') }}
          restore-keys: wdfw-creel-

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          # No fallback to the unpinned requirements.txt. A failure here must stop
          # the run rather than quietly turning off the SHA-256 verification on the
          # one job that runs unattended every day.
          pip install --require-hashes -r requirements.lock.txt

      - name: Fetch new reports, rebuild and validate
        run: python src/pipeline.py --no-open

      - name: Refuse to commit anything but data and the built page
        run: |
          if ! git diff --quiet -- . ':(exclude)data' ':(exclude)docs'; then
            echo "::error::the refresh modified files outside data/ and docs/"
            git status --short
            exit 1
          fi

      - name: Commit the refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data docs; then
            echo "No new reports today."
            exit 0
          fi
          git add data docs
          git commit -m "Data refresh: $(date -u +%Y-%m-%d)"
          git push
