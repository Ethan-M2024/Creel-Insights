name: Rebuild after a parser change

# Changing how a report is read makes every already-extracted row stale, which means
# re-reading four hundred PDFs and fourteen years of paginated tables. That takes a
# while, so it happens here rather than on anyone's laptop: push a parser change and
# the refreshed data comes back as a commit.
on:
  push:
    branches: [main]
    paths:
      - 'src/sources/**'
      - 'src/build_data.py'
      - 'src/geo.py'
  workflow_dispatch:
    inputs:
      full:
        description: 'Ignore every cache and re-read every report'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      # keep the downloaded reports between runs so a rebuild skips the download
      - name: Restore the source cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache
          key: wdfw-creel-${{ hashFiles('data/manifest.json') }}
          restore-keys: wdfw-creel-

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock.txt

      - name: Re-read every report and rebuild
        run: python src/pipeline.py --no-open ${{ (github.event_name == 'workflow_dispatch' && inputs.full) && '--full' || '' }}

      - name: Commit the rebuilt data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data docs; then
            echo "The parser change produced identical data."
            exit 0
          fi
          git add data docs
          git commit -m "Rebuild after parser change: ${GITHUB_SHA::7}"
          git push
